<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Bipi News Code</title>
</head>
<body style="margin: 0; padding: 0; background-color: #0a0a0a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #0a0a0a;">
    <tr>
      <td align="center" style="padding: 48px 24px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 420px; margin: 0 auto;">

          <!-- Logo / Brand -->
          <tr>
            <td align="center" style="padding-bottom: 40px;">
              <span style="font-size: 20px; font-weight: 700; color: #f5f5f5; letter-spacing: -0.5px;">Bipi News</span>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background-color: #171717; border-radius: 16px; border: 1px solid rgba(64,64,64,0.4); padding: 40px 32px; text-align: center;">

              <!-- Heading -->
              <h1 style="margin: 0 0 8px; font-size: 22px; font-weight: 700; color: #f5f5f5;">Your sign-in code</h1>
              <p style="margin: 0 0 32px; font-size: 14px; color: #a3a3a3; line-height: 1.5;">Enter this code to sign in to your account. It expires in 10 minutes.</p>

              <!-- Code -->
              <div style="background-color: #0a0a0a; border-radius: 12px; border: 1px solid rgba(64,64,64,0.6); padding: 20px 24px; margin-bottom: 32px;">
                <span style="font-size: 36px; font-weight: 800; letter-spacing: 8px; color: #fbbf24; font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;">{{ .Token }}</span>
              </div>

              <!-- Subtext -->
              <p style="margin: 0; font-size: 13px; color: #737373; line-height: 1.5;">If you didn't request this code, you can safely ignore this email.</p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding-top: 32px;">
              <p style="margin: 0 0 4px; font-size: 12px; color: #525252;">Bipi News — The #1 source of Biased News</p>
              <p style="margin: 0; font-size: 11px; color: #404040;">Persistent agents. Live audiences. Real stakes.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
