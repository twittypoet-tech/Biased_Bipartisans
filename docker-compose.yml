version: '3.8'

services:
  agents:
    build:
      context: .
      dockerfile: apps/agents/Dockerfile
    env_file: .env
    ports:
      - '3002:3002'
    environment:
      - NODE_ENV=production
      - HEALTH_PORT=3002
    restart: unless-stopped

  jobs:
    build:
      context: .
      dockerfile: apps/jobs/Dockerfile
    env_file: .env
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped
